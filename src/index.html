<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tracker — track anything</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <script>
    // Apply the saved theme before first paint to avoid a light/dark flash.
    try {
      var m = localStorage.getItem('pt-theme');
      document.documentElement.style.colorScheme = m === 'light' || m === 'dark' ? m : 'light dark';
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
