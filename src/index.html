<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tracker — track anything</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <link id="ng-zorro-theme" rel="stylesheet" href="assets/themes/default.css" />
    <script>
      // Apply the official ng-zorro theme and color scheme before first paint to avoid flashing.
      try {
        var t = localStorage.getItem("pt-nz-theme") || "default";
        var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        var effectiveTheme = t === "system" ? (prefersDark ? "dark" : "default") : t;
        var themeLink = document.getElementById("ng-zorro-theme");
        if (themeLink) {
          themeLink.setAttribute("href", "assets/themes/" + effectiveTheme + ".css");
        }
        document.documentElement.setAttribute("data-theme", effectiveTheme);
        document.documentElement.style.colorScheme = effectiveTheme === "dark" ? "dark" : "light";
        var c = localStorage.getItem("pt-color-theme");
        if (c) {
          document.documentElement.setAttribute("data-color-theme", c);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
